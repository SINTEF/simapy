[build-system]
requires = ["setuptools>=70.0.0", "wheel>=0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simapy"
version = "5.4.0"
description = "Python utilities for SIMA"
readme = "README.md"
authors = [
    {name = "SINTEF Ocean"}
]
requires-python = ">=3.11"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "dmtpy==0.3.6",
    "numpy",
    "simapy-results==5.4.0",
    "tqdm",
]

[project.optional-dependencies]
pandas = ["simapy-results[pandas]==5.4.0"]
hdf5 = ["simapy-results[hdf5]==5.4.0"]
all = ["simapy[pandas,hdf5]"]

[project.urls]
Homepage = "https://github.com/SINTEF/simapy"

[dependency-groups]
dev = [
    "pylint>=4",
    "pytest>=8.3.5",
    "simapy[all]",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], exclude = ["tests", "tests.*"]}}

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
simapy-results = { workspace = true }

# Each distribution runs its own tests: both test folders are packages named `tests`.
[tool.pytest.ini_options]
testpaths = ["src/tests"]
