# GitLab port of .github/workflows/testing.yml.
# Publishing to PyPI stays on GitHub (sima/issue#916), so there is no build or
# publish stage here — GitLab is for development and testing only.
# All runners in the sima group are tagged; linux+sima are the docker executors.

stages: [test, deploy]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    # Branch pipelines, but not a second one alongside an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

default:
  tags: [linux, sima]
  image: python:3.12-slim
  interruptible: true
  before_script:
    - pip install --quiet uv
  cache:
    key: uv-$CI_JOB_IMAGE
    paths: [.cache/uv]

test:
  stage: test
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13", "3.14"]
  image: python:$PYTHON-slim
  script:
    - uv sync                     # project + dev group, from uv.lock
    - mkdir -p output
    - uv run pytest --junitxml output/report.xml
  artifacts:
    when: always
    paths: [output/report.xml]
    reports:
      junit: output/report.xml
    expire_in: 1 week

# Errors-only pylint on the lowest supported version.
lint:
  stage: test
  image: python:3.11-slim
  script:
    - uv sync
    - uv run pylint src/ --errors-only


# The examples moved in from the simapy-examples repository. Their docs autodoc
# the example modules, so this fails if an example stops being importable --
# easy to do by accident, since an example that runs as a script is not
# necessarily importable as examples.<domain>.<module>.
docs:
  stage: test
  script:
    - uv sync --group docs
    - cd examples/docs
    - uv run --group docs python -m sphinx -b html . _build/html
  artifacts:
    paths: [examples/docs/_build/html]
    expire_in: 1 week

# Only from the default branch, matching the GitHub workflow the examples came
# with. The project and its Pages site are private, so this is the team's copy.
pages:
  stage: deploy
  needs: [docs]
  script:
    - mv examples/docs/_build/html public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
