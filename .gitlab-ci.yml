# GitLab port of .github/workflows/testing.yml.
# Publishing to PyPI stays on GitHub (sima/issue#916), so there is no build or
# publish stage here — GitLab is for development and testing only.
# All runners in the sima group are tagged; linux+sima are the docker executors.

stages: [test]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    # Branch pipelines, but not a second one alongside an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

default:
  tags: [linux, sima]
  image: python:3.12-slim
  interruptible: true
  before_script:
    - pip install --quiet uv
  cache:
    key: uv-$CI_JOB_IMAGE
    paths: [.cache/uv]

test:
  stage: test
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13", "3.14"]
  image: python:$PYTHON-slim
  script:
    - uv sync --all-packages      # both distributions + dev group, from uv.lock
    - mkdir -p output
    - uv run pytest --junitxml output/report.xml
    - uv run pytest packages/simapy-results --junitxml output/report-results.xml
  artifacts:
    when: always
    paths: [output/report*.xml]
    reports:
      junit: output/report*.xml
    expire_in: 1 week

# Without the optional extras, so the paths that run without pandas and h5py stay honest.
test-minimal:
  stage: test
  script:
    - uv sync --all-packages --no-dev
    - uv run --no-dev --with pytest pytest
    - uv run --no-dev --with pytest pytest packages/simapy-results

# simapy-results alone, without simapy and dmtpy, as a post-processing tool installs it.
test-results-standalone:
  stage: test
  script:
    - uv sync --package simapy-results --extra hdf5 --no-dev
    - uv run --package simapy-results --no-dev --with pytest pytest packages/simapy-results

# Errors-only pylint on the lowest supported version.
lint:
  stage: test
  image: python:3.11-slim
  script:
    - uv sync --all-packages
    - uv run pylint src/ packages/simapy-results/src --errors-only
